# Redis（与 docker-compose 相同的 redis:8-alpine）。本地测试不做持久化，
# 缓存丢了由 sub2api 自行重建。密码来自 sub2api-secret。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: sub2api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:8-alpine
          args: ["redis-server", "--appendonly", "no", "--requirepass", "$(REDIS_PASSWORD)"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sub2api-secret
                  key: REDIS_PASSWORD
            # redis-cli 通过 REDISCLI_AUTH 认证，探针和 `./make kind redis` 都依赖它
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: sub2api-secret
                  key: REDIS_PASSWORD
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: sub2api
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379

# sub2api 本地 kind 集群（`./make kind up` 使用）。
# 单节点即可：sub2api 以 NodePort 30080 暴露，映射到宿主机 127.0.0.1:18080。
# hostPort 会被 tools/mk 换成 SUB2API_KIND_PORT（默认 18080，避开 buildmaxdev 的 8080）。
# 只监听回环地址，避免本地测试实例暴露到局域网。
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 18080
        listenAddress: "127.0.0.1"
        protocol: TCP
